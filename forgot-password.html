<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <title>Vidyasutra | Reset Password</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-page">
  <main class="auth-card" style="max-width: 540px; grid-template-columns: 1fr;">
    <section class="form-panel">
      <div class="top-line" style="justify-content: space-between;">
        <a href="index.html" class="brand" style="background:none;padding:0;">
          <span class="brand-mark"><span></span><span></span><span></span><span></span></span>
          <span class="brand-copy"><strong>Vidya<span>sutra</span></strong></span>
        </a>
        <a href="login.html">← Back to Log In</a>
      </div>

      <div class="login-container">
        <h1>Reset your password</h1>
        <p class="intro">Enter your registered campus email and set a new password directly in your local workspace.</p>
        <div id="resetStatus" class="status-banner hidden" role="status"></div>

        <form id="resetForm">
          <div class="form-group">
            <label for="resetEmail">Registered Email</label>
            <div class="input-box">
              <span class="input-icon">✉</span>
              <input type="email" id="resetEmail" placeholder="aarav@vidyasutra.edu" required />
            </div>
          </div>
          <div class="form-group">
            <label for="newPassword">New Password</label>
            <div class="input-box">
              <span class="input-icon">🔒</span>
              <input type="password" id="newPassword" placeholder="Enter new password (min. 6 chars)" required minlength="6" />
            </div>
          </div>
          <button type="submit" class="primary-btn">Update Password →</button>
        </form>
      </div>
    </section>
  </main>
  <script src="auth-utils.js"></script>
  <script>
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('resetStatus');
      const email = document.getElementById('resetEmail').value.trim();
      const newPass = document.getElementById('newPassword').value;
      const auth = window.VidyaSutraAuth;
      if (newPass.length < 6) {
        status.textContent = 'Password must be at least 6 characters.';
        status.className = 'status-banner error';
        return;
      }
      const accounts = auth.readAccounts();
      const idx = accounts.findIndex(a => auth.normalizedEmail(a.email) === auth.normalizedEmail(email));
      if (idx === -1) {
        status.textContent = 'No local account found for that email. Try creating an account first.';
        status.className = 'status-banner error';
        return;
      }
      const hashed = await auth.hashPassword(newPass);
      accounts[idx].salt = hashed.salt;
      accounts[idx].passwordHash = hashed.passwordHash;
      auth.writeAccounts(accounts);
      status.textContent = 'Password updated! Redirecting to login…';
      status.className = 'status-banner success';
      setTimeout(() => window.location.assign('login.html'), 1100);
    });
  </script>
</body>
</html>
